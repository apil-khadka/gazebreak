name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "RELEASE_NOTES.md"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published, edited, deleted]
  # Releases created by GITHUB_TOKEN do not emit downstream release workflows.
  workflow_run:
    workflows: ["Release GazeBreak", "Self-signed experimental release"]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Release events may point at tags; always publish the current docs.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install and check the site
        working-directory: docs
        run: |
          npm ci
          npm test
      - name: Build with current release information
        working-directory: docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
