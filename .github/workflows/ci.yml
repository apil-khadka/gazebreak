name: Build GazeBreak

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build release
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Run timer self-test
        run: swift run -c release GazeBreak --self-test
